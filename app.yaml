# =============================================================================
# app.yaml - everything the platform needs to know about this app.
#
# You declare WHAT you need. The platform decides HOW: which image, which
# credential, which table, which cron, which IAM role, which corporate group.
# That is why there is no connection string, no Dockerfile and no pipeline in
# this repository - and why the loader rejects one if you add it.
#
# Every line below turns into something real at deploy time. The mapping is in
# docs/ARCHITECTURE.md, "What each line of app.yaml becomes".
# =============================================================================

apiVersion: v1
app: headcount-dashboard
team: people-ops
kind: web                        # web | job

# -----------------------------------------------------------------------------
# ACCESS - two different questions, deliberately kept apart.
#
#   manage:  who can change, deploy and govern THIS APP        (control plane)
#
# Mixing these is the most common way internal platforms leak. Being able to
# deploy an app is not the same as being allowed to read what it reads.
# -----------------------------------------------------------------------------
access:

  manage:
    # Full control. Approves production deploys, requests data access, adds
    # people, deletes the app. Must be a corporate group, never an individual -
    # individuals leave.
    owners:
      - MG-PEOPLE-OPS

    # Day-to-day engineering. Can deploy to dev and uat, read logs and
    # telemetry, open PRs. CANNOT deploy to prod and CANNOT request data access.
    contributors:
      - MG-PEOPLE-OPS-ENG

    # Can see that the app exists, its health and its telemetry. No deploys,
    # no data. Usually a neighbouring team or an internal auditor.
    readers:
      - MG-FINANCE-BI

  # Roles the app itself checks at runtime with require_role("headcount-viewer").
  # The platform reconciles each role to a corporate group at deploy time, so
  # nobody hand-creates groups and nobody hand-checks membership.
# -----------------------------------------------------------------------------
# RUNTIME - what this runs on. You pick from what the platform publishes;
# you do not build an image.
# -----------------------------------------------------------------------------
runtime:
                                 # you automatically. `==` is rejected.
  size: small                    # small | medium | large -> cpu/memory/replicas

# -----------------------------------------------------------------------------
# DATA - logical dataset names. Never a table, never a connection, never a
# credential. Run `insights datasets` to see what you can ask for.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# CONNECTIONS - the systems this app talks to. Two different engines, on purpose:
# a warehouse and an internal REST API. The call site is the same shape for both.
#
# `secret` is a NAME. Values live in the secret store under insights/<app>/, which
# our team writes and the platform team cannot read. A credential typed here would
# be in git history forever, so the manifest loader refuses one.
# -----------------------------------------------------------------------------
connections:
  - name: hr-warehouse
    engine: sqlite               # databricks-sql in dev and prod
    path: ../insights-platform/runtime/fakes/warehouse/warehouse.db

  - name: people-directory
    engine: rest
    base_url: ${INSIGHTS_DIRECTORY_URL}
    secret: directory-api-token
    timeout: 10
                                 # told, and do not need to know, which is which.

# -----------------------------------------------------------------------------
# WEB - only for kind: web.
# -----------------------------------------------------------------------------
web:
  route: /headcount-dashboard    # where the edge publishes you

  type: spa                      # api | spa
                                 #
                                 #   api        FastAPI, JSON only. No UI.
                                 #   spa        FastAPI backend + YOUR frontend in static/.
                                 #              We serve it from the same origin; we do not
                                 #              build it. No Node in the runtime image.
                                 #   streamlit  You write one app.py. The platform supplies
                                 #              the identity shim, a health sidecar and
                                 #              sticky sessions.
                                 #
                                 # `type` picks the base image, how identity reaches your
                                 # code and the health contract. It does NOT change how you
                                 # reach data - query() is identical in all of them.

  health: /healthz               # generated. Checks every connection above and
                                 # checks its credential was injected.

# -----------------------------------------------------------------------------
# ENVIRONMENTS - which environments exist and who lets a release into them.
# The approver lists point at the groups in access.manage above, so promotion
# rights and app ownership cannot drift apart.
# -----------------------------------------------------------------------------
environments:
  dev:
    auto_deploy: true            # every merge to main
  uat:
    auto_deploy: false
    approvers: contributors
  prod:
    auto_deploy: false
    approvers: owners            # only MG-PEOPLE-OPS can release to production
    change_window: business-hours
