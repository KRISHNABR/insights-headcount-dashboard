# =============================================================================
# headcount-dashboard — an interactive web app.
#
# This file is the ONLY configuration this app has. Everything in it is a
# DECLARATION: what we need and who owns it, never mechanism.
#
# Full schema reference: docs/APP-YAML.md in the platform repo.
# =============================================================================

apiVersion: v1
app: headcount-dashboard
team: people-ops
kind: web                        # web | job

# -----------------------------------------------------------------------------
# ACCESS — three tiers, and there is no fourth. They NEST: an owner satisfies
# every check a contributor does, and a contributor every check a reader does.
#
# Corporate groups, never individuals — individuals leave. The union of these is
# what the edge uses to decide who may reach the app at all; `require_role()`
# checks them again inside the code.
# -----------------------------------------------------------------------------
access:
  manage:
    owners:       [MG-PEOPLE-OPS]        # approve prod · change access · answer for it
    contributors: [MG-PEOPLE-OPS-ENG]    # deploy dev and uat · read logs · NOT prod
    readers:      [MG-FINANCE-BI]        # use the app and see its telemetry, nothing more

runtime:
  size: small                    # small | medium | large -> cpu / memory / replicas

# -----------------------------------------------------------------------------
# CONNECTIONS — two systems, two engines, one call shape.
#
# Each block describes PRODUCTION; `local:` is the stand-in for a laptop, applied
# only when INSIGHTS_ENV=local. Fields named under `local:` override; the rest is
# inherited.
# -----------------------------------------------------------------------------
connections:

  # A warehouse, reached over SQL.
  - name: hr-warehouse
    engine: databricks-sql
    host: ${HR_WAREHOUSE_HOST}
    http_path: ${HR_WAREHOUSE_HTTP_PATH}
    local:
      engine: sqlite
      path: ${INSIGHTS_WAREHOUSE_PATH}

  # An internal REST API. `query()` takes a PATH instead of SQL; the connector
  # attaches the bearer token. `secret:` is a NAME — the value is in the secret
  # store, which our team writes and the platform team cannot read.
  - name: people-directory
    engine: rest
    base_url: ${INSIGHTS_DIRECTORY_URL}
    secret: directory-api-token
    timeout: 10

# -----------------------------------------------------------------------------
# WEB — only for kind: web.
#
#   route   where the edge publishes this app. Everything under it is proxied
#           to us, with identity already established and verified.
#   type    api  JSON only, no frontend
#           spa  our own built bundle in static/, served from the SAME origin as
#                the API — which is what lets the browser hold nothing but a
#                session cookie it cannot read. We serve it; we do not build it.
#   health  generated by the SDK. Opens every connection above and confirms the
#           credential arrived, so a deploy that starts fine and fails on first
#           use is caught here rather than by a user.
# -----------------------------------------------------------------------------
web:
  route: /headcount-dashboard
  type: spa                      # api | spa
  health: /healthz
